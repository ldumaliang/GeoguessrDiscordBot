name: Daily GeoGuessr Friends

on:
  schedule:
    - cron: "55 23 * * *"
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: write

jobs:
  simulate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run simulation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_PR }}
        run: npm run simulate

  run-daily:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: last-token-${{ github.run_id }}
          restore-keys: |
            last-token-

      - name: Install dependencies
        run: npm ci

      - name: Run daily job
        env:
          NCFA_TOKEN: ${{ secrets.NCFA_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCORE_HISTORY_PATH: ${{ vars.SCORE_HISTORY_PATH || 'data/score-history.csv' }}
          SCORE_HISTORY_FORMAT: ${{ vars.SCORE_HISTORY_FORMAT || 'csv' }}
        run: npm run start

      - name: Commit score history
        if: env.SCORE_HISTORY_PATH != ''
        run: |
          if [ ! -f "$SCORE_HISTORY_PATH" ]; then
            echo "Score history file not found; skipping commit."
            exit 0
          fi
          if git diff --quiet -- "$SCORE_HISTORY_PATH"; then
            echo "No score history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SCORE_HISTORY_PATH"
          git commit -m "chore: update daily score history"
          git push
