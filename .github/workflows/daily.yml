name: Daily GeoGuessr Friends

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch: {}
  pull_request: {}

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: last-token-${{ github.run_id }}
          restore-keys: |
            last-token-

      - name: Install dependencies
        run: npm ci

      - name: Run daily job
        env:
          NCFA_TOKEN: ${{ secrets.NCFA_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ github.event_name == 'pull_request' && secrets.DISCORD_WEBHOOK_URL_PR || secrets.DISCORD_WEBHOOK_URL }}
        run: npm run start
